<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CRISPR in Action 3D</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050814; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 10; text-align: center; width: 90%; max-width: 400px;
    }
    button {
      background: #00e5ff; border: none; color: #050814; padding: 14px 28px;
      font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); transition: 0.2s;
    }
    button:active { transform: scale(0.95); }
    #status { color: #fff; margin-bottom: 10px; font-size: 14px; letter-spacing: 1px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="ui">
    <div id="status">STATUS: TARGETING DNA...</div>
    <button id="action-btn" onclick="triggerCut()">CUT DNA</button>
  </div>

  <script>
    // 1. Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const pointLight = new THREE.PointLight(0x00e5ff, 1.5, 100);
    pointLight.position.set(10, 10, 10);
    scene.add(pointLight);

    // 2. Build DNA Helix
    const dnaGroup = new THREE.Group();
    const leftStrand = [], rightStrand = [], rungs = [];
    const numPairs = 30, helixRadius = 3, helixHeight = 30;

    const blueMat = new THREE.MeshPhongMaterial({ color: 0x0088ff });
    const cyanMat = new THREE.MeshPhongMaterial({ color: 0x00e5ff });
    const redMat = new THREE.MeshPhongMaterial({ color: 0xff0055 });

    for (let i = 0; i < numPairs; i++) {
      const y = (i / numPairs) * helixHeight - helixHeight / 2;
      const angle = i * 0.5;

      const p1 = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), blueMat);
      p1.position.set(Math.cos(angle) * helixRadius, y, Math.sin(angle) * helixRadius);
      dnaGroup.add(p1);
      leftStrand.push({ mesh: p1, origY: y });

      const p2 = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), cyanMat);
      p2.position.set(Math.cos(angle + Math.PI) * helixRadius, y, Math.sin(angle + Math.PI) * helixRadius);
      dnaGroup.add(p2);
      rightStrand.push({ mesh: p2, origY: y });

      // Base pairs (Rungs)
      const rungGeo = new THREE.CylinderGeometry(0.1, 0.1, helixRadius * 2, 8);
      const rung = new THREE.Mesh(rungGeo, (i >= 13 && i <= 17) ? redMat : new THREE.MeshPhongMaterial({ color: 0xffffff }));
      rung.position.set(0, y, 0);
      rung.rotation.z = Math.PI / 2;
      rung.rotation.y = -angle;
      dnaGroup.add(rung);
      rungs.push({ mesh: rung, index: i });
    }
    scene.add(dnaGroup);

    // 3. Build Cas9 Enzyme Body
    const cas9Mat = new THREE.MeshPhongMaterial({ color: 0x9900ff, transparent: true, opacity: 0.65 });
    const cas9 = new THREE.Mesh(new THREE.SphereGeometry(5.5, 32, 32), cas9Mat);
    cas9.scale.set(1.4, 1, 1);
    scene.add(cas9);

    // 4. Animation Controls
    let isCut = false;
    function triggerCut() {
      isCut = true;
      document.getElementById('status').innerText = "STATUS: CLEAVAGE COMPLETE!";
      document.getElementById('status').style.color = "#ff0055";
      document.getElementById('action-btn').style.display = "none";
    }

    // Render Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      if (!isCut) {
        dnaGroup.rotation.y += 0.005;
      } else {
        // Break DNA apart at cut site
        leftStrand.forEach((pt, idx) => {
          if (idx >= 15) pt.mesh.position.y += 0.05;
          else pt.mesh.position.y -= 0.05;
        });
        rightStrand.forEach((pt, idx) => {
          if (idx >= 15) pt.mesh.position.y += 0.05;
          else pt.mesh.position.y -= 0.05;
        });
        rungs.forEach(r => {
          if (r.index >= 13 && r.index <= 17) r.mesh.scale.x *= 0.95; // Dissolve target cut site
        });
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
